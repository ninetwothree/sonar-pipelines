on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        description: 'Token for SonarQube authentication'
        required: true
    inputs:
      SONAR_DOMAIN_NAME:
          description: 'Domain name of the SonarQube server'
          required: false
          type: string
          default: sonarqube.ninetwothree.co
      FETCH_DEPTH:
          required: false
          default: 0
          type: number
      PYTHON_VERSION:
          description: 'Python version to be used in report generation'
          required: false
          type: string
          default: '3.11'
      RUN_FLAKE8:
          description: 'Flag to determine if flake8 report is needed'
          required: false
          type: boolean
          default: false
      RUNNER_LABEL:
          description: 'Label of a runner to use self-host or not latest'
          required: false
          default: ''
          type: string

name: Scan project with SonarQube scanner
jobs:
  build:
    name: Run checks
    runs-on: ${{ inputs.RUNNER_LABEL || vars.RUNS_ON || (github.repository_owner == 'ninetwothree' && 'fireactions' || 'ubuntu-latest') }}
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: ${{ inputs.FETCH_DEPTH }}

    - name: Resolve runner network
      id: net
      shell: bash
      env:
        RESOLVED_RUNNER: ${{ inputs.RUNNER_LABEL || vars.RUNS_ON || (github.repository_owner == 'ninetwothree' && 'fireactions' || 'ubuntu-latest') }}
        SONAR_DOMAIN: ${{ inputs.SONAR_DOMAIN_NAME }}
      run: |
        set -euo pipefail
        case "$RESOLVED_RUNNER" in
          sonar)
            mode="sonar"
            proxy_host="squid"
            proxy_url="http://squid:3129"
            no_proxy="localhost,127.0.0.1"
            api_url="http://sonar:9000"
            ;;
          ubuntu-*|macos-*|windows-*)
            mode="github-hosted"
            proxy_host="$SONAR_DOMAIN"
            proxy_url=""
            no_proxy="localhost,127.0.0.1,binaries.sonarsource.com"
            api_url="https://$SONAR_DOMAIN"
            ;;
          *)
            mode="direct"
            proxy_host=""
            proxy_url=""
            no_proxy="localhost,127.0.0.1"
            api_url="https://$SONAR_DOMAIN"
            ;;
        esac
        proxy_args=""
        if [ -n "$proxy_host" ]; then
          proxy_args="-Dhttp.proxyPort=3129 -Dhttps.proxyPort=3129 -Dhttp.proxyHost=$proxy_host -Dhttps.proxyHost=$proxy_host"
        fi
        echo "Runner: $RESOLVED_RUNNER, proxy: ${proxy_url:-none}, API: $api_url"
        {
          echo "proxy_args=$proxy_args"
          echo "proxy_url=$proxy_url"
          echo "no_proxy=$no_proxy"
          echo "api_url=$api_url"
          echo "mode=$mode"
        } >> "$GITHUB_OUTPUT"


    - name: Check for preinstalled Python
      id: python
      shell: bash
      env:
        WANTED_VERSION: ${{ inputs.PYTHON_VERSION }}
      run: |
        set -euo pipefail
        # Runner images may already ship the wanted Python; skip setup-python then.
        for bin in "python${WANTED_VERSION}" python3 python; do
          path="$(command -v "$bin" 2>/dev/null)" || continue
          version="$("$path" -c 'import platform; print(platform.python_version())' 2>/dev/null)" || continue
          # It also needs Poetry, or pip to install Poetry with.
          if ! command -v poetry > /dev/null 2>&1 && ! "$path" -m pip --version > /dev/null 2>&1; then
            continue
          fi
          if [ "$version" = "$WANTED_VERSION" ] || [[ "$version" == "$WANTED_VERSION".* ]]; then
            echo "Python $version is already installed: $path"
            # Later steps call python/python3; wrappers rather than symlinks,
            # because a symlinked venv interpreter loses its venv.
            mkdir -p "$RUNNER_TEMP/python-bin"
            for name in python python3; do
              printf '#!/bin/sh\nexec "%s" "$@"\n' "$path" > "$RUNNER_TEMP/python-bin/$name"
              chmod +x "$RUNNER_TEMP/python-bin/$name"
            done
            echo "$RUNNER_TEMP/python-bin" >> "$GITHUB_PATH"
            echo "preinstalled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done
        echo "preinstalled=false" >> "$GITHUB_OUTPUT"

    - name: Set up Python
      if: ${{ steps.python.outputs.preinstalled != 'true' }}
      uses: actions/setup-python@main
      with:
        python-version: ${{ inputs.PYTHON_VERSION }}

    - name: Install poetry
      if: ${{ inputs.RUN_FLAKE8 }}
      env:
        # A preinstalled system Python may be marked externally managed (PEP 668).
        PIP_BREAK_SYSTEM_PACKAGES: ${{ steps.python.outputs.preinstalled == 'true' && '1' || '0' }}
      run: |
        if command -v poetry >/dev/null 2>&1; then
          echo "poetry already present: $(poetry --version)"
        else
          python3 -m pip install --upgrade pip
          python3 -m pip install poetry
          # pip installs into the interpreter's scripts dir, or into the user
          # site when it can't write there (a system Python); put both on PATH.
          for scheme in "" posix_user; do
            bin_dir="$(python3 -c 'import sys, sysconfig; print(sysconfig.get_path("scripts", *sys.argv[1:]))' $scheme)"
            export PATH="$bin_dir:$PATH"
            echo "$bin_dir" >> "$GITHUB_PATH"
          done
        fi

    - name: Install poetry project dependencies
      if: ${{ inputs.RUN_FLAKE8 }}
      run: |
        poetry install

    - name: Run Flake8 and generate report
      if: ${{ inputs.RUN_FLAKE8 }}
      run: |
        poetry run flake8 src --format=json --output-file=flake8-report.json --ignore E501 || true

    - name: Generate sonar project name
      run: |
        printf "\nsonar.projectKey = ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ github.head_ref || github.ref_name }}" | sed s/'\/'/'-'/g >> sonar-project.properties

    - name: SonarQube Scan
      uses: sonarsource/sonarqube-scan-action@master
      with:
        args: >
          ${{ steps.net.outputs.proxy_args }}
      env:
        HTTP_PROXY: ${{ steps.net.outputs.proxy_url }}
        HTTPS_PROXY: ${{ steps.net.outputs.proxy_url }}
        NO_PROXY: ${{ steps.net.outputs.no_proxy }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ format('https://{0}', inputs.SONAR_DOMAIN_NAME) }}

    - name: SonarQube Quality Gate check
      id: sonarqube-quality-gate-check
      continue-on-error: true
      uses: sonarsource/sonarqube-quality-gate-action@master
      timeout-minutes: 5
      env:
       SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
       SONAR_HOST_URL: ${{ format('https://{0}', inputs.SONAR_DOMAIN_NAME) }}

    - name: Get detailed SonarQube issues
      if: steps.sonarqube-quality-gate-check.outcome == 'failure'
      continue-on-error: false
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_API_URL: ${{ steps.net.outputs.api_url }}
      run: |
        PROJECT_KEY=$(echo "${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ github.head_ref || github.ref_name }}" | sed 's/\//-/g')
        curl -s -u $SONAR_TOKEN: "$SONAR_API_URL/api/issues/search?componentKeys=${PROJECT_KEY}&resolved=no&ps=500" > sonar_issues.json

        total=$(jq -r '.total' sonar_issues.json)

        if [ "$total" -eq 0 ]; then
          echo "Quality Gate Check failed!"
          echo ""
          echo "Quality Gate exception list:"
          conditions_json=$(curl -s -u $SONAR_TOKEN: "$SONAR_API_URL/api/qualitygates/project_status?projectKey=$PROJECT_KEY")

          echo "### Quality Gate Check failed!" >> $GITHUB_STEP_SUMMARY
          echo "#### Quality Gate exception list::" >> $GITHUB_STEP_SUMMARY
          echo "Metric | Actual Value | Comparator | Error Threshold" >> $GITHUB_STEP_SUMMARY
          echo "--- | --- | --- | ---" >> $GITHUB_STEP_SUMMARY

          echo "$conditions_json" | jq -r '
            .projectStatus.conditions[]
            | select(.status == "ERROR")
            | "\(.metricKey) | \(.actualValue) | \(.comparator) | \(.errorThreshold)"
          ' >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

        echo "### Detailed SonarQube Issues" >> $GITHUB_STEP_SUMMARY
        echo "File | Line | Error type | Description" >> $GITHUB_STEP_SUMMARY
        echo "--- | --- | --- | ---" >> $GITHUB_STEP_SUMMARY
        jq -r '.issues[] | "\(.component) | \(.line) | \(.severity) | \(.message)"' sonar_issues.json | tee sonar_issues_summary.txt | tee -a $GITHUB_STEP_SUMMARY

        echo "Detailed issues summary:"
        cat sonar_issues_summary.txt
        exit 1
