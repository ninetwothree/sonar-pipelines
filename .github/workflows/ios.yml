on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        description: 'Token for SonarQube authentication'
        required: true
    inputs:
      SONAR_DOMAIN_NAME:
          description: 'Domain name of the SonarQube server'
          required: false
          type: string
          default: sonarqube.ninetwothree.co
      FETCH_DEPTH:
          required: false
          default: 0
          type: number
      GIT_LFS_PATH:
        required: false
        default: "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin"
        type: string
      RUNNER_LABEL:
          description: 'Label of a runner to use self-host or not latest'
          required: false
          default: ''
          type: string

name: Scan project with SonarQube scanner
jobs:
  sonar-scan:
    runs-on: ${{ inputs.RUNNER_LABEL != '' && inputs.RUNNER_LABEL || (github.repository_owner == 'ninetwothree' && 'self-hosted-macos' || 'macos-latest') }}
    env:
      GIT_LFS_PATH: ${{ inputs.GIT_LFS_PATH }}
    steps:
    - name: Configure environment
      run: |
        echo "${GIT_LFS_PATH}" >> $GITHUB_PATH
    - name: Set up Git LFS
      run: |
        # Install git-lfs
        /opt/homebrew/bin/git-lfs install
    - uses: actions/checkout@v4
      with:
        fetch-depth: ${{ inputs.FETCH_DEPTH }}
        lfs: true
    - name: Generate sonar project name
      run: |
        printf "\nsonar.projectKey = ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ github.head_ref || github.ref_name }}" | sed 's|/|-|g; s/[()]//g' >> sonar-project.properties
    - name: Resolve network mode
      # Only the org's own self-hosted-macos/"sonar" runner is network-isolated
      # behind squid - it's the only case that needs any proxy at all. Every
      # other runner (macos-latest fallback for repos outside this org, or a
      # caller-supplied RUNNER_LABEL) has normal internet access and should
      # talk to SonarQube directly - it already answers on 443 publicly.
      # Routing those through squid or the :3129 domain proxy was the bug:
      # neither forwards arbitrary hosts like binaries.sonarsource.com, so
      # anything needing to reach outside SonarQube itself failed there.
      id: net
      run: |
        if [ "${{ inputs.RUNNER_LABEL == 'sonar' || (inputs.RUNNER_LABEL == '' && github.repository_owner == 'ninetwothree') }}" = "true" ]; then
          echo "use_proxy=true" >> "$GITHUB_OUTPUT"
        else
          echo "use_proxy=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Install sonar-scanner (non-self-hosted runner)
      # self-hosted-macos carries sonar-scanner baked into its image; a
      # generic macos-latest fallback (e.g. a repo transferred out of this
      # org) has nothing preinstalled.
      if: steps.net.outputs.use_proxy == 'false'
      run: |
        command -v sonar-scanner >/dev/null 2>&1 || brew install sonar-scanner
    - name: SonarQube Scan
      run: |
        export PATH=$PATH:~/.local/bin:${GIT_LFS_PATH}
        if [ "${{ steps.net.outputs.use_proxy }}" = "true" ]; then
          export HTTP_PROXY=http://squid:3129
          export HTTPS_PROXY=http://squid:3129
          sonar-scanner -Dhttp.proxyPort=3129 -Dhttps.proxyPort=3129 -Dhttp.proxyHost=squid -Dhttps.proxyHost=squid
        else
          sonar-scanner
        fi
      env:
        NO_PROXY: localhost,127.0.0.1
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ format('https://{0}', inputs.SONAR_DOMAIN_NAME) }}
    - name: SonarQube Quality Gate check
      id: sonarqube-quality-gate-check
      continue-on-error: true
      uses: sonarsource/sonarqube-quality-gate-action@v1.1.0
      timeout-minutes: 5
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ format('https://{0}', inputs.SONAR_DOMAIN_NAME) }}
        SONAR_SCANNER_JAVA_OPTS: -Xms512m -Xmx2048m

    - name: Get detailed SonarQube issues
      if: steps.sonarqube-quality-gate-check.outcome == 'failure'
      continue-on-error: false
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        PROJECT_KEY=$(echo "${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ github.head_ref || github.ref_name }}" | sed 's|/|-|g; s/[()]//g')
        if [ "${{ inputs.RUNNER_LABEL != '' && inputs.RUNNER_LABEL || (github.repository_owner == 'ninetwothree' && 'self-hosted-macos' || 'macos-latest') }}" = "" ]; then
          curl -s -u $SONAR_TOKEN: "http://sonar:9000/api/issues/search?componentKeys=${PROJECT_KEY}&resolved=no&ps=500" > sonar_issues.json
        else
          curl -s -u $SONAR_TOKEN: "https://${{ vars.SONAR_DOMAIN_NAME }}/api/issues/search?componentKeys=${PROJECT_KEY}&resolved=no&ps=500" > sonar_issues.json
        fi
        total=$(jq -r '.total' sonar_issues.json)
        if [ "$total" -eq 0 ]; then
          echo "Quality Gate Check failed!"
          echo ""
          echo "Quality Gate exception list:"
          if [ "${{ inputs.RUNNER_LABEL != '' && inputs.RUNNER_LABEL || (github.repository_owner == 'ninetwothree' && 'self-hosted-macos' || 'macos-latest') }}" = "" ]; then
            conditions_json=$(curl -s -u $SONAR_TOKEN: "http://sonar:9000/api/qualitygates/project_status?projectKey=$PROJECT_KEY")
          else
            conditions_json=$(curl -s -u $SONAR_TOKEN: "https://${{ vars.SONAR_DOMAIN_NAME }}/api/qualitygates/project_status?projectKey=$PROJECT_KEY")
          fi
          echo "### Quality Gate Check failed!" >> $GITHUB_STEP_SUMMARY
          echo "#### Quality Gate exception list::" >> $GITHUB_STEP_SUMMARY
          echo "Metric | Actual Value | Comparator | Error Threshold" >> $GITHUB_STEP_SUMMARY
          echo "--- | --- | --- | ---" >> $GITHUB_STEP_SUMMARY
          echo "$conditions_json" | jq -r '
            .projectStatus.conditions[]
            | select(.status == "ERROR")
            | "\(.metricKey) | \(.actualValue) | \(.comparator) | \(.errorThreshold)"
          ' >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
        echo "### Detailed SonarQube Issues" >> $GITHUB_STEP_SUMMARY
        echo "File | Line | Error type | Description" >> $GITHUB_STEP_SUMMARY
        echo "--- | --- | --- | ---" >> $GITHUB_STEP_SUMMARY
        jq -r '.issues[] | "\(.component) | \(.line) | \(.severity) | \(.message)"' sonar_issues.json | tee sonar_issues_summary.txt | tee -a $GITHUB_STEP_SUMMARY

        echo "Detailed issues summary:"
        cat sonar_issues_summary.txt
        exit 1
