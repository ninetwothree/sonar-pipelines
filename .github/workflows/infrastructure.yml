on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        description: 'Token for SonarQube authentication'
        required: true
    inputs:
      SONAR_DOMAIN_NAME:
          description: 'Domain name of the SonarQube server'
          required: false
          type: string
          default: sonarqube.ninetwothree.co
      FETCH_DEPTH:
          required: false
          default: 0
          type: number
      RUN_PRECOMMIT:
          description: 'Flag to determine if precommit should run'
          required: false
          default: true
          type: boolean
      RUN_CFN_LINT:
          description: 'Flag to determine if cfnlint should run'
          required: false
          default: true
          type: boolean
      RUN_TF_LINT:
          description: 'Flag to determine if tflint should run'
          required: false
          default: true
          type: boolean
      RUNNER_LABEL:
          description: 'Label of a runner to use self-host or not latest'
          required: false
          default: ''
          type: string

name: Scan project with SonarQube scanner
jobs:
  # TODO: https://github.com/containers/podman/issues/3917 check if we can have separate runner for that
  # run-pre-commit:
  #   if: ${{ inputs.RUN_PRECOMMIT }}
  #   name: Run pre-commit checks
  #   runs-on: ${{ inputs.RUNNER_LABEL }}
  #   steps:
  #   - uses: actions/checkout@v4
  #     with:
  #       fetch-depth: ${{ inputs.FETCH_DEPTH }}

  #   - name: Configure Git Safe Directory
  #     run: git config --global --add safe.directory /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}

  #   - name: Verify Git Repository
  #     run: git status

  #   - name: Run Pre-Commit Hooks
  #     run: podman run --privileged --network none -e SKIP='no-commit-to-branch' -v $PWD:/lint:Z -w /lint ghcr.io/ninetwothree/pre-commit:latest run -a

  run-sonar-checks:
    name: Run sonar checks
    runs-on: ${{ inputs.RUNNER_LABEL != '' && inputs.RUNNER_LABEL || (github.repository_owner == 'ninetwothree' && 'fireactions' || 'ubuntu-latest') }}
    env:
      # Self-hosted images may have no UTF-8 locale; Java then fails on
      # non-ASCII file names (InvalidPathException: Malformed input).
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Resolve runner network
      # How this runner reaches SonarQube:
      #   sonar        - locked-down self-hosted runner: everything via squid,
      #                  API calls to the internal sonar:9000 address.
      #   ubuntu-* etc - GitHub-hosted runners: unchanged, SonarQube's own
      #                  proxy on :3129.
      #   anything else (fireactions) - normal internet access: direct, no proxy.
      id: net
      shell: bash
      env:
        RESOLVED_RUNNER: ${{ inputs.RUNNER_LABEL != '' && inputs.RUNNER_LABEL || (github.repository_owner == 'ninetwothree' && 'fireactions' || 'ubuntu-latest') }}
        SONAR_DOMAIN: ${{ inputs.SONAR_DOMAIN_NAME }}
      run: |
        set -euo pipefail
        case "$RESOLVED_RUNNER" in
          sonar)
            mode="sonar"
            proxy_host="squid"
            proxy_url="http://squid:3129"
            no_proxy="localhost,127.0.0.1"
            api_url="http://sonar:9000"
            ;;
          ubuntu-*|macos-*|windows-*)
            mode="github-hosted"
            proxy_host="$SONAR_DOMAIN"
            proxy_url="https://$SONAR_DOMAIN:3129"
            no_proxy="localhost,127.0.0.1"
            api_url="https://$SONAR_DOMAIN"
            ;;
          *)
            mode="direct"
            proxy_host=""
            proxy_url=""
            no_proxy="localhost,127.0.0.1"
            api_url="https://$SONAR_DOMAIN"
            ;;
        esac
        proxy_args=""
        if [ -n "$proxy_host" ]; then
          proxy_args="-Dhttp.proxyPort=3129 -Dhttps.proxyPort=3129 -Dhttp.proxyHost=$proxy_host -Dhttps.proxyHost=$proxy_host"
        fi
        echo "Runner: $RESOLVED_RUNNER, proxy: ${proxy_url:-none}, API: $api_url"
        {
          echo "proxy_args=$proxy_args"
          echo "proxy_url=$proxy_url"
          echo "no_proxy=$no_proxy"
          echo "api_url=$api_url"
          echo "mode=$mode"
        } >> "$GITHUB_OUTPUT"


    - name: Install dependencies
      # The sonar runner image ships these tools; GitHub-hosted and fireactions
      # runners don't, so install only what is missing.
      if: ${{ inputs.RUN_CFN_LINT }}
      run: |
        SUDO=""
        if [ "$(id -u)" != "0" ]; then SUDO="sudo"; fi
        missing=""
        for bin in jq curl unzip; do command -v "$bin" >/dev/null 2>&1 || missing="$missing $bin"; done
        if [ "${{ inputs.RUN_CFN_LINT }}" = "true" ] && ! command -v cfn-lint >/dev/null 2>&1 && ! command -v pip3 >/dev/null 2>&1; then
          missing="$missing python3-pip"
        fi
        if [ -n "$missing" ]; then
          $SUDO apt-get update -qq
          # shellcheck disable=SC2086
          $SUDO apt-get install -y -qq $missing
        fi
        if [ "${{ inputs.RUN_CFN_LINT }}" = "true" ] && ! command -v cfn-lint >/dev/null 2>&1; then
          $SUDO pip3 install cfn-lint --break-system-packages || $SUDO pip3 install cfn-lint
        fi

    - name: Apply cfn-lint
      if: ${{ inputs.RUN_CFN_LINT }}
      run: |
        cfn-lint -f json --output-file cfnlint.json *.cfn || true

    - name: Setup TFLint
      # tflint's install_linux.sh was removed upstream (404). The sonar runner
      # ships tflint and has no internet, so only install it elsewhere.
      if: ${{ inputs.RUN_TF_LINT && steps.net.outputs.mode != 'sonar' }}
      uses: terraform-linters/setup-tflint@v4
      with:
        tflint_version: v0.52.0

    - name: Apply tflint
      if: ${{ inputs.RUN_TF_LINT }}
      run: |
        tflint --recursive -f json > tflint.json || true

    - name: Generate sonar project name
      run: |
        printf "\nsonar.projectKey = ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ github.head_ref || github.ref_name }}" | sed s/'\/'/'-'/g >> sonar-project.properties

    - name: SonarQube Scan
      uses: sonarsource/sonarqube-scan-action@v4.2.1
      with:
        args: >
          ${{ steps.net.outputs.proxy_args }}
      env:
        HTTP_PROXY: ${{ steps.net.outputs.proxy_url }}
        HTTPS_PROXY: ${{ steps.net.outputs.proxy_url }}
        NO_PROXY: ${{ steps.net.outputs.no_proxy }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ format('https://{0}', inputs.SONAR_DOMAIN_NAME) }}

    - name: SonarQube Quality Gate check
      id: sonarqube-quality-gate-check
      continue-on-error: true
      uses: sonarsource/sonarqube-quality-gate-action@v1.1.0
      timeout-minutes: 5
      env:
       SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
       SONAR_HOST_URL: ${{ format('https://{0}', inputs.SONAR_DOMAIN_NAME) }}

    - name: Get detailed SonarQube issues
      if: steps.sonarqube-quality-gate-check.outcome == 'failure'
      continue-on-error: false
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_API_URL: ${{ steps.net.outputs.api_url }}
      run: |
        PROJECT_KEY=$(echo "${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ github.head_ref || github.ref_name }}" | sed 's/\//-/g')
        curl -s -u $SONAR_TOKEN: "$SONAR_API_URL/api/issues/search?componentKeys=${PROJECT_KEY}&resolved=no&ps=500" > sonar_issues.json

        total=$(jq -r '.total' sonar_issues.json)

        if [ "$total" -eq 0 ]; then
          echo "Quality Gate Check failed!"
          echo ""
          echo "Quality Gate exception list:"
          conditions_json=$(curl -s -u $SONAR_TOKEN: "$SONAR_API_URL/api/qualitygates/project_status?projectKey=$PROJECT_KEY")

          echo "### Quality Gate Check failed!" >> $GITHUB_STEP_SUMMARY
          echo "#### Quality Gate exception list::" >> $GITHUB_STEP_SUMMARY
          echo "Metric | Actual Value | Comparator | Error Threshold" >> $GITHUB_STEP_SUMMARY
          echo "--- | --- | --- | ---" >> $GITHUB_STEP_SUMMARY

          echo "$conditions_json" | jq -r '
            .projectStatus.conditions[]
            | select(.status == "ERROR")
            | "\(.metricKey) | \(.actualValue) | \(.comparator) | \(.errorThreshold)"
          ' >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

        echo "### Detailed SonarQube Issues" >> $GITHUB_STEP_SUMMARY
        echo "File | Line | Error type | Description" >> $GITHUB_STEP_SUMMARY
        echo "--- | --- | --- | ---" >> $GITHUB_STEP_SUMMARY
        jq -r '.issues[] | "\(.component) | \(.line) | \(.severity) | \(.message)"' sonar_issues.json | tee sonar_issues_summary.txt | tee -a $GITHUB_STEP_SUMMARY

        echo "Detailed issues summary:"
        cat sonar_issues_summary.txt


        exit 1
