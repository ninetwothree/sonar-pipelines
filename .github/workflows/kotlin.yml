on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        description: 'Token for SonarQube authentication'
        required: true
    inputs:
      SONAR_DOMAIN_NAME:
          description: 'Domain name of the SonarQube server'
          required: false
          type: string
          default: sonarqube.ninetwothree.co
      FETCH_DEPTH:
          required: false
          default: 0
          type: number
      JAVA_VERSION:
          description: 'Java version to be used in report generation'
          required: false
          type: string
          default: '17'
      RUNNER_LABEL:
          description: 'Label of a runner to use self-host or not latest'
          required: false
          default: ''
          type: string
      LINTER:
          description: 'Linter from supported: Detekt or Ktlint'
          required: false
          default: ktlint
          type: string

name: Scan project with SonarQube scanner
jobs:
  run-sonar-checks:
    name: Build
    runs-on: ${{ inputs.RUNNER_LABEL != '' && inputs.RUNNER_LABEL || (github.repository_owner == 'ninetwothree' && 'fireactions' || 'ubuntu-latest') }}
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: ${{ inputs.FETCH_DEPTH }}

    - name: Resolve runner network
      id: net
      shell: bash
      env:
        RESOLVED_RUNNER: ${{ inputs.RUNNER_LABEL != '' && inputs.RUNNER_LABEL || (github.repository_owner == 'ninetwothree' && 'fireactions' || 'ubuntu-latest') }}
        SONAR_DOMAIN: ${{ inputs.SONAR_DOMAIN_NAME }}
      run: |
        set -euo pipefail
        case "$RESOLVED_RUNNER" in
          sonar)
            mode="sonar"
            proxy_host="squid"
            proxy_url="http://squid:3129"
            no_proxy="localhost,127.0.0.1"
            api_url="http://sonar:9000"
            ;;
          ubuntu-*|macos-*|windows-*)
            mode="github-hosted"
            proxy_host="$SONAR_DOMAIN"
            proxy_url="http://$SONAR_DOMAIN:3129"
            no_proxy="localhost,127.0.0.1,binaries.sonarsource.com"
            api_url="https://$SONAR_DOMAIN"
            ;;
          *)
            mode="direct"
            proxy_host=""
            proxy_url=""
            no_proxy="localhost,127.0.0.1"
            api_url="https://$SONAR_DOMAIN"
            ;;
        esac
        proxy_args=""
        if [ -n "$proxy_host" ]; then
          proxy_args="-Dhttp.proxyPort=3129 -Dhttps.proxyPort=3129 -Dhttp.proxyHost=$proxy_host -Dhttps.proxyHost=$proxy_host"
        fi
        echo "Runner: $RESOLVED_RUNNER, proxy: ${proxy_url:-none}, API: $api_url"
        {
          echo "proxy_args=$proxy_args"
          echo "proxy_url=$proxy_url"
          echo "no_proxy=$no_proxy"
          echo "api_url=$api_url"
          echo "mode=$mode"
        } >> "$GITHUB_OUTPUT"


    - name: Set up JDK
      uses: actions/setup-java@main
      with:
        java-version:  ${{ inputs.JAVA_VERSION }}
    - name: Generate sonar project name
      run: |
        printf "\nsonar.projectKey = ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ github.head_ref || github.ref_name }}" | sed 's|/|-|g; s/[()]//g' >> sonar-project.properties

    - name: Check with ktlint
      if: inputs.LINTER == 'ktlint'
      run: |
        bash -c 'CI="" ./gradlew ktlintCheck || :'
        find app/build/reports/ktlint/ -name "*.xml" -exec sed -i 's/home\/runner\/work\/${{ github.event.repository.name }}\/${{ github.event.repository.name }}/github\/workspace/g' {} \;
        list_of_reports=$(find app/build/reports/ktlint/ -name "*.xml" -print | tr '\n' ',')
        printf "\nsonar.kotlin.ktlint.reportPaths = ${list_of_reports:0:-1}" >> sonar-project.properties

    - name: Check with detekt
      if: inputs.LINTER == 'detekt'
      run: |
        bash -c 'CI="" ./gradlew detekt || :'
        find app/build/reports/detekt/ -name "*.xml" -exec sed -i 's/home\/runner\/work\/${{ github.event.repository.name }}\/${{ github.event.repository.name }}/github\/workspace/g' {} \;
        list_of_reports=$(find app/build/reports/detekt/ -name "*.xml" -print | tr '\n' ',')
        printf "\nsonar.kotlin.detekt.reportPaths = ${list_of_reports:0:-1}" >> sonar-project.properties
        rm -f app/build/reports/detekt/detekt.html

    - name: SonarQube Scan
      uses: sonarsource/sonarqube-scan-action@master
      with:
        skipSignatureVerification: true
        args: >
          ${{ steps.net.outputs.proxy_args }}
          -Dsonar.scm.disabled=true
      env:
        HTTP_PROXY: ${{ steps.net.outputs.proxy_url }}
        HTTPS_PROXY: ${{ steps.net.outputs.proxy_url }}
        # The self-hosted "sonar" runner has no direct internet route at all
        # (fully locked down behind squid, see squid.conf's own header) so it
        # must still proxy binaries.sonarsource.com too. Every other runner
        # already has normal internet access and doesn't need SonarQube's own
        # proxy for a generic public binary download - bypassing it here is
        # what lets the scan action's internal scanner-cli fetch (a plain
        # @actions/tool-cache download, unrelated to the actual SonarQube API
        # traffic below) skip the cross-domain tunnel entirely instead of
        # relying on whatever's listening on the public :3129 endpoint to
        # forward arbitrary CONNECT targets.
        NO_PROXY: ${{ steps.net.outputs.no_proxy }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ format('https://{0}', inputs.SONAR_DOMAIN_NAME) }}

    - name: SonarQube Quality Gate check
      id: sonarqube-quality-gate-check
      continue-on-error: true
      uses: sonarsource/sonarqube-quality-gate-action@master
      timeout-minutes: 5
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ format('https://{0}', inputs.SONAR_DOMAIN_NAME) }}
        SONAR_SCANNER_JAVA_OPTS: -Xms512m -Xmx2048m

    - name: Get detailed SonarQube issues
      if: steps.sonarqube-quality-gate-check.outcome == 'failure'
      continue-on-error: false
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_API_URL: ${{ steps.net.outputs.api_url }}
      run: |
        PROJECT_KEY=$(echo "${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ github.head_ref || github.ref_name }}" | sed 's|/|-|g; s/[()]//g')
        curl -s -u $SONAR_TOKEN: "$SONAR_API_URL/api/issues/search?componentKeys=${PROJECT_KEY}&resolved=no&ps=500" > sonar_issues.json
        curl -s -u $SONAR_TOKEN: "$SONAR_API_URL/api/hotspots/search?projectKey=${PROJECT_KEY}&ps=500" > sonar_vulnerabilities.json
        total=$(jq -r '.total' sonar_issues.json)
        vuln_total=$(jq -r '.paging.total' sonar_vulnerabilities.json)
        if [ "$total" -eq 0 ] && [ "$vuln_total" -eq 0 ]; then
          echo "Quality Gate Check failed!"
          echo ""
          echo "Quality Gate exception list:"
          conditions_json=$(curl -s -u $SONAR_TOKEN: "$SONAR_API_URL/api/qualitygates/project_status?projectKey=$PROJECT_KEY")
          echo "### Quality Gate Check failed!" >> $GITHUB_STEP_SUMMARY
          echo "#### Quality Gate exception list::" >> $GITHUB_STEP_SUMMARY
          echo "Metric | Actual Value | Comparator | Error Threshold" >> $GITHUB_STEP_SUMMARY
          echo "--- | --- | --- | ---" >> $GITHUB_STEP_SUMMARY
          echo "$conditions_json" | jq -r '
            .projectStatus.conditions[]
            | select(.status == "ERROR")
            | "\(.metricKey) | \(.actualValue) | \(.comparator) | \(.errorThreshold)"
          ' >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
        echo "### Detailed SonarQube Issues" >> $GITHUB_STEP_SUMMARY
        echo "File | Line | Error type | Description" >> $GITHUB_STEP_SUMMARY
        echo "--- | --- | --- | ---" >> $GITHUB_STEP_SUMMARY
        jq -r '.issues[] | "\(.component) | \(.line) | \(.severity) | \(.message)"' sonar_issues.json | tee sonar_issues_summary.txt | tee -a $GITHUB_STEP_SUMMARY
        jq -r '.hotspots[] | "\(.component) | \(.line) | \(.vulnerabilityProbability) | \(.message)"' sonar_vulnerabilities.json | tee -a sonar_issues_summary.txt | tee -a $GITHUB_STEP_SUMMARY

        echo "Detailed issues summary:"
        cat sonar_issues_summary.txt
        exit 1
