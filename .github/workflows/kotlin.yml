on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        description: 'Token for SonarQube authentication'
        required: true
    inputs:
      SONAR_DOMAIN_NAME:
          description: 'Domain name of the SonarQube server'
          required: false
          type: string
          default: sonarqube.ninetwothree.co
      FETCH_DEPTH:
          required: false
          default: 0
          type: number
      JAVA_VERSION:
          description: 'Java version to be used in report generation'
          required: false
          type: string
          default: '17'
      RUNNER_LABEL:
          description: 'Label of a runner to use self-host or not latest'
          required: false
          default: ''
          type: string
      LINTER:
          description: 'Linter from supported: Detekt or Ktlint'
          required: false
          default: ktlint
          type: string

name: Scan project with SonarQube scanner
jobs:
  run-sonar-checks:
    name: Build
    runs-on: ${{ inputs.RUNNER_LABEL != '' && inputs.RUNNER_LABEL || (github.repository_owner == 'ninetwothree' && 'sonar' || 'ubuntu-latest') }}
    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: ${{ inputs.FETCH_DEPTH }}

    - name: Set up JDK
      uses: actions/setup-java@v1
      with:
        java-version:  ${{ inputs.JAVA_VERSION }}
    - name: Generate sonar project name
      run: |
        printf "\nsonar.projectKey = ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ github.head_ref || github.ref_name }}" | sed 's|/|-|g; s/[()]//g' >> sonar-project.properties

    - name: Check with ktlint
      if: inputs.LINTER == 'ktlint'
      run: |
        bash -c 'CI="" ./gradlew ktlintCheck || :'
        find app/build/reports/ktlint/ -name "*.xml" -exec sed -i 's/home\/runner\/work\/${{ github.event.repository.name }}\/${{ github.event.repository.name }}/github\/workspace/g' {} \;
        list_of_reports=$(find app/build/reports/ktlint/ -name "*.xml" -print | tr '\n' ',')
        printf "\nsonar.kotlin.ktlint.reportPaths = ${list_of_reports:0:-1}" >> sonar-project.properties

    - name: Check with detekt
      if: inputs.LINTER == 'detekt'
      run: |
        bash -c 'CI="" ./gradlew detekt || :'
        find app/build/reports/detekt/ -name "*.xml" -exec sed -i 's/home\/runner\/work\/${{ github.event.repository.name }}\/${{ github.event.repository.name }}/github\/workspace/g' {} \;
        list_of_reports=$(find app/build/reports/detekt/ -name "*.xml" -print | tr '\n' ',')
        printf "\nsonar.kotlin.detekt.reportPaths = ${list_of_reports:0:-1}" >> sonar-project.properties
        rm -f app/build/reports/detekt/detekt.html

    - name: SonarQube Scan
      uses: sonarsource/sonarqube-scan-action@v8.1.0
      with:
        args: >
          -Dhttp.proxyPort=3129
          -Dhttps.proxyPort=3129
          -Dhttp.proxyHost=${{ (inputs.RUNNER_LABEL == 'sonar' || (inputs.RUNNER_LABEL == '' && github.repository_owner == 'ninetwothree')) && 'squid' || inputs.SONAR_DOMAIN_NAME }}
          -Dhttps.proxyHost=${{ (inputs.RUNNER_LABEL == 'sonar' || (inputs.RUNNER_LABEL == '' && github.repository_owner == 'ninetwothree')) && 'squid' || inputs.SONAR_DOMAIN_NAME }}
          -Dsonar.scm.disabled=true
      env:
        HTTP_PROXY: ${{ (inputs.RUNNER_LABEL == 'sonar' || (inputs.RUNNER_LABEL == '' && github.repository_owner == 'ninetwothree')) && 'http://squid:3129' || format('https://{0}:3129', inputs.SONAR_DOMAIN_NAME) }}
        HTTPS_PROXY: ${{ (inputs.RUNNER_LABEL == 'sonar' || (inputs.RUNNER_LABEL == '' && github.repository_owner == 'ninetwothree')) && 'http://squid:3129' || format('https://{0}:3129', inputs.SONAR_DOMAIN_NAME) }}
        NO_PROXY: localhost,127.0.0.1
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ format('https://{0}', inputs.SONAR_DOMAIN_NAME) }}

    - name: SonarQube Quality Gate check
      id: sonarqube-quality-gate-check
      continue-on-error: true
      uses: sonarsource/sonarqube-quality-gate-action@v1.1.0
      timeout-minutes: 5
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ format('https://{0}', inputs.SONAR_DOMAIN_NAME) }}
        SONAR_SCANNER_JAVA_OPTS: -Xms512m -Xmx2048m

    - name: Get detailed SonarQube issues
      if: steps.sonarqube-quality-gate-check.outcome == 'failure'
      continue-on-error: false
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        PROJECT_KEY=$(echo "${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ github.head_ref || github.ref_name }}" | sed 's|/|-|g; s/[()]//g')
        if [ "${{ inputs.RUNNER_LABEL != '' && inputs.RUNNER_LABEL || (github.repository_owner == 'ninetwothree' && 'sonar' || 'ubuntu-latest') }}" = "" ]; then
          curl -s -u $SONAR_TOKEN: "http://sonar:9000/api/issues/search?componentKeys=${PROJECT_KEY}&resolved=no&ps=500" > sonar_issues.json
          curl -s -u $SONAR_TOKEN: "http://sonar:9000/api/hotspots/search?projectKey=${PROJECT_KEY}&ps=500" > sonar_vulnerabilities.json
        else
          curl -s -u $SONAR_TOKEN: "https://${{ vars.SONAR_DOMAIN_NAME }}/api/issues/search?componentKeys=${PROJECT_KEY}&resolved=no&ps=500" > sonar_issues.json
          curl -s -u $SONAR_TOKEN: "https://${{ vars.SONAR_DOMAIN_NAME }}/api/hotspots/search?projectKey=${PROJECT_KEY}&ps=500" > sonar_vulnerabilities.json
        fi
        total=$(jq -r '.total' sonar_issues.json)
        vuln_total=$(jq -r '.paging.total' sonar_vulnerabilities.json)
        if [ "$total" -eq 0 ] && [ "$vuln_total" -eq 0 ]; then
          echo "Quality Gate Check failed!"
          echo ""
          echo "Quality Gate exception list:"
          if [ "${{ inputs.RUNNER_LABEL != '' && inputs.RUNNER_LABEL || (github.repository_owner == 'ninetwothree' && 'sonar' || 'ubuntu-latest') }}" = "" ]; then
            conditions_json=$(curl -s -u $SONAR_TOKEN: "http://sonar:9000/api/qualitygates/project_status?projectKey=$PROJECT_KEY")
          else
            conditions_json=$(curl -s -u $SONAR_TOKEN: "https://${{ vars.SONAR_DOMAIN_NAME }}/api/qualitygates/project_status?projectKey=$PROJECT_KEY")
          fi
          echo "### Quality Gate Check failed!" >> $GITHUB_STEP_SUMMARY
          echo "#### Quality Gate exception list::" >> $GITHUB_STEP_SUMMARY
          echo "Metric | Actual Value | Comparator | Error Threshold" >> $GITHUB_STEP_SUMMARY
          echo "--- | --- | --- | ---" >> $GITHUB_STEP_SUMMARY
          echo "$conditions_json" | jq -r '
            .projectStatus.conditions[]
            | select(.status == "ERROR")
            | "\(.metricKey) | \(.actualValue) | \(.comparator) | \(.errorThreshold)"
          ' >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
        echo "### Detailed SonarQube Issues" >> $GITHUB_STEP_SUMMARY
        echo "File | Line | Error type | Description" >> $GITHUB_STEP_SUMMARY
        echo "--- | --- | --- | ---" >> $GITHUB_STEP_SUMMARY
        jq -r '.issues[] | "\(.component) | \(.line) | \(.severity) | \(.message)"' sonar_issues.json | tee sonar_issues_summary.txt | tee -a $GITHUB_STEP_SUMMARY
        jq -r '.hotspots[] | "\(.component) | \(.line) | \(.vulnerabilityProbability) | \(.message)"' sonar_vulnerabilities.json | tee -a sonar_issues_summary.txt | tee -a $GITHUB_STEP_SUMMARY

        echo "Detailed issues summary:"
        cat sonar_issues_summary.txt
        exit 1
